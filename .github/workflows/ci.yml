name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    defaults:
      run: { working-directory: frontend }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run: { working-directory: frontend }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/

  scraper:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run: { working-directory: tools/scraper }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: tools/scraper/requirements.txt
      - run: pip install -r requirements.txt
      - run: python -m compileall .

      # compileall only proves the file parses. The validator in
      # propose_edits.py is the only thing standing between a model's proposal
      # and /data, and it had a case in its own table asserting the bug: a
      # quote saying "helpful but not required" was pinned as VALID support for
      # adding a prerequisite. Nothing ran the table, so nothing said so.
      # It needs no network and no token.
      - name: the propose_edits validator still refuses what it should
        working-directory: tools/scraper
        run: python propose_edits.py --self-check

      # The enrolment reader turns a term's six registry PDFs into every mod's
      # schedule at once, so a reader that drifts writes the wrong room into 40
      # course files in one run. Its parsing is pure and needs no PDF: the
      # shapes in the table are ones these files actually produce, including a
      # weeks line that wraps into the record it precedes.
      - name: the enrolment readers still read what they should
        working-directory: .
        run: python tools/enrolment/parse_enrolment_pdfs.py --self-check

      # Which mods get a batch chat is decided by a tag, and getting it wrong
      # is invisible from the outside: a course quietly stops offering one, or
      # quietly starts. The distinction that matters is Core against Core
      # Elective, because one is taken by everyone and one is chosen.
      - name: a core is told from a core elective
        working-directory: .
        run: python tools/scraper/gather_cores.py --self-check

      # A room string that is not a room is invisible: the slot is written, the
      # heatmap draws, and nothing says the room does not exist. "Albert",
      # "Lecture" and "Online" all reached /data that way. One reader now, so
      # one check, covering both doors: a pasted timetable and the enrolment
      # import. It also generates every sub-phrase of every venue name and
      # asserts none of them resolves to a room that is not its own.
      - name: a room string still resolves to a real room
        working-directory: .
        run: python tools/venue_resolve.py --self-check

      # Where an untermed course lands decides which term filter finds it,
      # where the plan first puts it, and whether it can have a batch chat.
      # A wrong answer is invisible: the course simply sits in a term nobody
      # expects it in. Needs no network.
      - name: an untermed course still lands where it belongs
        working-directory: tools/scraper
        run: python gather_mods.py --self-check

      # The home-screen icon is geometry, not taste: the maskable safe zone is
      # a circle of radius 2/5 of the icon, and artwork past it is clipped by a
      # launcher mask. It shipped over that line twice, because nothing here
      # could see it - the unit suite reads the manifest, never the pixels.
      # Checked in this job because it is the one with Python; Pillow is not in
      # requirements.txt, so it is installed just for this step.
      - name: PWA icons are inside the maskable safe zone
        working-directory: .
        run: |
          pip install --quiet pillow
          python tools/icons/make_icons.py --check
