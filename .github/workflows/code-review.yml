# LLM code review on contributor PRs, via alibaba/open-code-review.
# Needs one of GEMINI_TOKEN, GROQ_TOKEN or OPENAI_TOKEN. Maintainers can
# re-run a review by commenting /open-code-review.
#
# pull_request_target runs with base-repo secrets against untrusted PR
# code - safe only because the action never executes PR code, it just
# reads the diff. Do not add build/test steps to THIS workflow.
name: OpenCodeReview PR Review

concurrency:
    group: >-
        ${{
          (
            github.event_name == 'pull_request_target'
            || (
              github.event_name == 'issue_comment'
              && github.event.issue.pull_request
              && github.event.comment.user.type != 'Bot'
              && (
                github.event.comment.author_association == 'MEMBER'
                || github.event.comment.author_association == 'OWNER'
                || github.event.comment.author_association == 'COLLABORATOR'
              )
              && (
                startsWith(github.event.comment.body, '/open-code-review')
                || startsWith(github.event.comment.body, '@open-code-review')
              )
            )
          )
          && format('ocr-{0}', github.event.pull_request.number || github.event.issue.number)
          || format('noop-{0}', github.run_id)
        }}
    cancel-in-progress: true

on:
    pull_request_target:
        types: [opened, synchronize, reopened]
        # Half the file filtering. This half is all-or-nothing - it skips only
        # when EVERY changed file matches - so its job is the cheap one: a pull
        # request touching nothing but course and venue JSON starts no runner.
        # The per-file half, which is what a MIXED pull request needs, is
        # `exclude` in .opencodereview/rule.json.
        paths-ignore:
            - 'data/**'
            - '**/package-lock.json'
    issue_comment:
        types: [created]

permissions:
    contents: read
    pull-requests: write
    # Read-only, and only so the verdict step can read back the sticky summary
    # comment the action just posted. A PR's top-level comments live under the
    # issues API, which pull-requests: write does not reach.
    issues: read

jobs:
    # Resolved once and shared, so the three provider jobs below differ only in
    # which endpoint they call.
    context:
        runs-on: ubuntu-latest
        if: |
            github.event_name == 'pull_request_target'
            || (
              github.event_name == 'issue_comment'
              && github.event.issue.pull_request
              && github.event.comment.user.type != 'Bot'
              && (
                github.event.comment.author_association == 'MEMBER'
                || github.event.comment.author_association == 'OWNER'
                || github.event.comment.author_association == 'COLLABORATOR'
              )
              && (
                startsWith(github.event.comment.body, '/open-code-review')
                || startsWith(github.event.comment.body, '@open-code-review')
              )
            )
        outputs:
            base_ref: ${{ steps.pr.outputs.base_ref }}
            head_sha: ${{ steps.pr.outputs.head_sha }}
            has_gemini: ${{ steps.keys.outputs.gemini }}
            has_groq: ${{ steps.keys.outputs.groq }}
            has_openai: ${{ steps.keys.outputs.openai }}
        steps:
            # A job-level `if:` cannot read `secrets`, only `vars`. A run step can, so
            # the token check happens here once and the provider jobs below read the
            # answer. Without this, an unconfigured provider shows a red job on every
            # PR instead of being skipped.
            - name: Which providers have a token
              id: keys
              run: |
                  echo "gemini=${{ secrets.GEMINI_TOKEN != '' }}" >> "$GITHUB_OUTPUT"
                  echo "groq=${{ secrets.GROQ_TOKEN != '' }}" >> "$GITHUB_OUTPUT"
                  echo "openai=${{ secrets.OPENAI_TOKEN != '' }}" >> "$GITHUB_OUTPUT"

            - name: Get PR context
              id: pr
              if: github.event_name == 'issue_comment'
              uses: actions/github-script@v7
              with:
                  script: |
                      const { data: pullRequest } = await github.rest.pulls.get({
                        owner: context.repo.owner,
                        repo: context.repo.repo,
                        pull_number: context.issue.number
                      });
                      core.setOutput('base_ref', pullRequest.base.ref);
                      core.setOutput('head_sha', pullRequest.head.sha);

    # Gemini first, then Groq, then OpenAI. Each falls through on failure OR on
    # being unconfigured, so setting up any one of the three is enough.
    gemini:
        runs-on: ubuntu-latest
        timeout-minutes: 30
        needs: context
        if: needs.context.outputs.has_gemini == 'true'
        # An attempt, not the verdict. The next provider takes over when this
        # one is unreachable - Gemini answers 503 often enough - and a red
        # check nobody can act on would block branch protection for no reason.
        # Only the last in the chain reports failure.
        #
        # continue-on-error is on the STEP, not the job. At job level it
        # rewrites `needs.gemini.result` to 'success' on a failure, so the
        # `!= 'success'` guards below never fire and the fallback chain is dead.
        # `outcome` is the step's result BEFORE continue-on-error is applied,
        # which is the honest one - as far as the process goes. Whether a
        # review happened is a different question, and the verdict step answers
        # it.
        outputs:
            ok: ${{ steps.verdict.outputs.ok }}
        steps:
            - id: review
              continue-on-error: true
              uses: alibaba/open-code-review@main
              with:
                  llm_url: https://generativelanguage.googleapis.com/v1beta/openai/chat/completions
                  llm_auth_token: ${{ secrets.GEMINI_TOKEN }}
                  llm_model: ${{ vars.GEMINI_MODEL || 'gemini-3.8-flash' }}
                  llm_use_anthropic: "false"
                  # The action defaults extra_body to {"thinking": ...}, which
                  # none of these three accept: Gemini answers 400 "Unknown name
                  # thinking" in under a second, and the run reads as "provider
                  # or subtask request failed" with no clue which field did it.
                  llm_extra_body: "{}"
                  # A ceiling, not a target: a normal PR of a few dozen
                  # source files never reaches it. Past it the action stops
                  # dispatching, publishes what it already has and exits 0,
                  # which is the difference between a partial review and the
                  # run that answered 413 and then retried itself into 429s.
                  max_tokens_budget: '600000'
                  # Fewer requests in flight, so a provider's rate limit is
                  # reached less often and a retry has room to succeed.
                  review_concurrency: '2'
                  base_ref: ${{ needs.context.outputs.base_ref }}
                  head_sha: ${{ needs.context.outputs.head_sha }}

            # A GREEN STEP IS NOT A COMPLETED REVIEW, and this is the step that
            # tells the difference. When every subtask is rate-limited the
            # action publishes what it has, which is nothing, and exits 0. So
            # `outcome` said success, `ok` said true, and the next provider was
            # skipped: groq answered 429 on six of eight items with a
            # retry-after of an hour, and the check went green with no review on
            # the pull request at all.
            #
            # The truth is written in the sticky summary comment, which says
            # "Review partially complete: 0 finding(s); 6 of 8 selected item(s)
            # failed". That string is the signal. It is a string match, so if the
            # action rewords it this goes back to trusting every run: the guard
            # is that an unreadable summary counts as a failure, and the chain
            # falls through rather than believing a review it cannot see.
            - name: Did it actually review
              id: verdict
              if: always()
              env:
                  GH_TOKEN: ${{ github.token }}
                  OUTCOME: ${{ steps.review.outcome }}
                  PR: ${{ github.event.pull_request.number || github.event.issue.number }}
              run: |
                  ok=true
                  [ "$OUTCOME" = "success" ] || ok=false
                  if [ "$ok" = true ]; then
                    # --paginate, because gh returns 30 comments a page and
                    # the summary is the newest thing on a pull request that has
                    # been reviewed a few times. Without it a long thread reads
                    # as no summary at all, which this step then treats as a
                    # failure, so every provider falls through on a busy PR.
                    # sticky_summary means exactly one comment matches, so the
                    # concatenated per-page output is that one body.
                    body="$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments"                       --paginate                       --jq '.[] | select(.body | contains("<!-- ocr-summary -->")) | .body'                       2>/dev/null || echo '')"
                    case "$body" in
                      ''|null) ok=false ;;
                      *'item(s) failed'*) ok=false ;;
                    esac
                  fi
                  echo "ok=$ok" >> "$GITHUB_OUTPUT"
                  echo "$OUTCOME / ok=$ok" >> "$GITHUB_STEP_SUMMARY"

    groq:
        runs-on: ubuntu-latest
        timeout-minutes: 30
        needs: [context, gemini]
        if: |
            always()
            && needs.context.result == 'success'
            && needs.gemini.outputs.ok != 'true'
            && needs.context.outputs.has_groq == 'true'
        # As above: step-level, and the verdict step decides what gets
        # published for openai.
        outputs:
            ok: ${{ steps.verdict.outputs.ok }}
        steps:
            - id: review
              continue-on-error: true
              uses: alibaba/open-code-review@main
              with:
                  llm_url: https://api.groq.com/openai/v1/chat/completions
                  llm_auth_token: ${{ secrets.GROQ_TOKEN }}
                  # llm_model: ${{ vars.GROQ_MODEL || 'openai/gpt-oss-120b' }}
                  llm_model: ${{ vars.GROQ_MODEL || 'openai/gpt-oss-20b' }}
                  llm_use_anthropic: "false"
                  # The action defaults extra_body to {"thinking": ...}, which
                  # none of these three accept: Gemini answers 400 "Unknown name
                  # thinking" in under a second, and the run reads as "provider
                  # or subtask request failed" with no clue which field did it.
                  llm_extra_body: "{}"
                  # A ceiling, not a target: a normal PR of a few dozen
                  # source files never reaches it. Past it the action stops
                  # dispatching, publishes what it already has and exits 0,
                  # which is the difference between a partial review and the
                  # run that answered 413 and then retried itself into 429s.
                  max_tokens_budget: '600000'
                  # Fewer requests in flight, so a provider's rate limit is
                  # reached less often and a retry has room to succeed.
                  review_concurrency: '2'
                  base_ref: ${{ needs.context.outputs.base_ref }}
                  head_sha: ${{ needs.context.outputs.head_sha }}

            # A GREEN STEP IS NOT A COMPLETED REVIEW, and this is the step that
            # tells the difference. When every subtask is rate-limited the
            # action publishes what it has, which is nothing, and exits 0. So
            # `outcome` said success, `ok` said true, and the next provider was
            # skipped: groq answered 429 on six of eight items with a
            # retry-after of an hour, and the check went green with no review on
            # the pull request at all.
            #
            # The truth is written in the sticky summary comment, which says
            # "Review partially complete: 0 finding(s); 6 of 8 selected item(s)
            # failed". That string is the signal. It is a string match, so if the
            # action rewords it this goes back to trusting every run: the guard
            # is that an unreadable summary counts as a failure, and the chain
            # falls through rather than believing a review it cannot see.
            - name: Did it actually review
              id: verdict
              if: always()
              env:
                  GH_TOKEN: ${{ github.token }}
                  OUTCOME: ${{ steps.review.outcome }}
                  PR: ${{ github.event.pull_request.number || github.event.issue.number }}
              run: |
                  ok=true
                  [ "$OUTCOME" = "success" ] || ok=false
                  if [ "$ok" = true ]; then
                    # --paginate, because gh returns 30 comments a page and
                    # the summary is the newest thing on a pull request that has
                    # been reviewed a few times. Without it a long thread reads
                    # as no summary at all, which this step then treats as a
                    # failure, so every provider falls through on a busy PR.
                    # sticky_summary means exactly one comment matches, so the
                    # concatenated per-page output is that one body.
                    body="$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments"                       --paginate                       --jq '.[] | select(.body | contains("<!-- ocr-summary -->")) | .body'                       2>/dev/null || echo '')"
                    case "$body" in
                      ''|null) ok=false ;;
                      *'item(s) failed'*) ok=false ;;
                    esac
                  fi
                  echo "ok=$ok" >> "$GITHUB_OUTPUT"
                  echo "$OUTCOME / ok=$ok" >> "$GITHUB_STEP_SUMMARY"

    openai:
        runs-on: ubuntu-latest
        timeout-minutes: 30
        needs: [context, gemini, groq]
        # Last in the chain, so its verdict is the one that decides whether
        # the check goes red. It still needs the verdict step: a green EXIT
        # is not a completed review here either, and without it a run where
        # every provider was rate-limited ends on a passing check with
        # nothing on the pull request. continue-on-error lets the verdict
        # step run at all; the fail step below is what turns the check red.
        if: |
            always()
            && needs.context.result == 'success'
            && needs.gemini.outputs.ok != 'true'
            && needs.groq.outputs.ok != 'true'
            && needs.context.outputs.has_openai == 'true'
        steps:
            - id: review
              continue-on-error: true
              uses: alibaba/open-code-review@main
              with:
                  llm_url: https://api.openai.com/v1/chat/completions
                  llm_auth_token: ${{ secrets.OPENAI_TOKEN }}
                  llm_model: ${{ vars.OPENAI_MODEL || 'gpt-5.4-mini' }}
                  llm_use_anthropic: "false"
                  # The action defaults extra_body to {"thinking": ...}, which
                  # none of these three accept: Gemini answers 400 "Unknown name
                  # thinking" in under a second, and the run reads as "provider
                  # or subtask request failed" with no clue which field did it.
                  llm_extra_body: "{}"
                  # A ceiling, not a target: a normal PR of a few dozen
                  # source files never reaches it. Past it the action stops
                  # dispatching, publishes what it already has and exits 0,
                  # which is the difference between a partial review and the
                  # run that answered 413 and then retried itself into 429s.
                  max_tokens_budget: '600000'
                  # Fewer requests in flight, so a provider's rate limit is
                  # reached less often and a retry has room to succeed.
                  review_concurrency: '2'
                  base_ref: ${{ needs.context.outputs.base_ref }}
                  head_sha: ${{ needs.context.outputs.head_sha }}

            # Same reader as gemini and groq: the sticky summary comment is the
            # only place that says whether items failed, and an unreadable
            # summary counts as a failure.
            - name: Did it actually review
              id: verdict
              if: always()
              env:
                  GH_TOKEN: ${{ github.token }}
                  OUTCOME: ${{ steps.review.outcome }}
                  PR: ${{ github.event.pull_request.number || github.event.issue.number }}
              run: |
                  ok=true
                  [ "$OUTCOME" = "success" ] || ok=false
                  if [ "$ok" = true ]; then
                    body="$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" \
                      --paginate \
                      --jq '.[] | select(.body | contains("<!-- ocr-summary -->")) | .body' \
                      2>/dev/null || echo '')"
                    case "$body" in
                      ''|null) ok=false ;;
                      *'item(s) failed'*) ok=false ;;
                    esac
                  fi
                  echo "ok=$ok" >> "$GITHUB_OUTPUT"
                  echo "$OUTCOME / ok=$ok" >> "$GITHUB_STEP_SUMMARY"

            # The whole chain has now been tried. A green check here would say a
            # review happened, so say the opposite out loud instead.
            - name: No provider completed a review
              if: always() && steps.verdict.outputs.ok != 'true'
              run: |
                  echo "::error::Every configured provider failed or was rate-limited." \
                       "The pull request has no review. Re-run with /open-code-review" \
                       "once the limit resets."
                  exit 1
