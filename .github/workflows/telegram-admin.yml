# Daily handover sweep: in each live batch chat the throwaway is still
# sitting in, promote the earliest human joiner (spam removal needs an
# admin, and only the creator can appoint one in a basic group), pin the
# handover note, and leave. Relies on TG_* secrets.
name: Telegram admin sweep

on:
    # NOT monthly, unlike most scheduled jobs here. Until a human is promoted the
    # chat has no admin, so nobody can remove anyone from it - and a month of that
    # is a month of a group nobody can moderate. The first step exits without
    # doing anything when the TG_* secrets are absent or no chat is waiting, so
    # the daily run costs a few seconds while this is dormant.
    schedule:
        - cron: "30 22 * * *" # 06:30 SGT daily
    workflow_dispatch:

permissions:
    contents: write

concurrency:
    group: telegram-groups
    cancel-in-progress: false

jobs:
    sweep:
        runs-on: ubuntu-latest
        timeout-minutes: 15
        steps:
            - uses: actions/checkout@v4
              with:
                  ref: main
                  # Pushes to main, so it must authenticate as the token's owner.
                  # main's ruleset requires a reviewed pull request and its only
                  # bypass actor is the admin repository role, which
                  # github-actions[bot] does not hold and cannot be granted.
                  # Without this the push is rejected GH013 after the work is done.
                  token: ${{ secrets.MODSUTD_BOT_TOKEN || secrets.GITHUB_TOKEN }}

            - name: Skip when unconfigured or nothing to do
              id: check
              env:
                  HAS_SESSION: ${{ secrets.TG_SESSION != '' }}
              run: |
                  python3 - <<'PY' >> "$GITHUB_OUTPUT"
                  import json, os, pathlib
                  if os.environ.get("HAS_SESSION") != "true":
                      print("run=no"); raise SystemExit
                  import datetime
                  reg = json.loads(pathlib.Path("data/telegram-groups.json").read_text() or "{}")
                  today = datetime.date.today().isoformat()
                  # Three jobs: hand a chat over to its first human, look again
                  # at one already handed over in case that admin has left, and
                  # walk out of one whose term is done. Gating on the first
                  # alone meant neither of the others ran.
                  pending = any(not e.get("adminGranted") for e in reg.values())
                  leaving = any(
                      not e.get("left") and str(e.get("expires") or "") and str(e["expires"]) < today
                      for e in reg.values()
                  )
                  # A live chat this account can still address is re-checked
                  # every run. Telegram takes a member's admin rights with them
                  # when they leave, so a handover recorded months ago says
                  # nothing about whether the chat has an admin today.
                  recheck = any(
                      e.get("adminGranted") and not e.get("left") and e.get("supergroup")
                      and e.get("accessHash") is not None
                      and str(e.get("expires") or "") >= today
                      for e in reg.values()
                  )
                  print(f"run={'yes' if pending or leaving or recheck else 'no'}")
                  PY

            - name: Hand over to the first joiner
              if: steps.check.outputs.run == 'yes'
              env:
                  TG_API_ID: ${{ secrets.TG_API_ID }}
                  TG_API_HASH: ${{ secrets.TG_API_HASH }}
                  TG_SESSION: ${{ secrets.TG_SESSION }}
                  # Handover re-exports the invite link after migrating, so this
                  # sweep now writes ciphertext into the registry and needs the
                  # same key create_group.py uses.
                  TG_LINK_KEY: ${{ secrets.TG_LINK_KEY }}
              run: |
                  pip install --quiet telethon cryptography
                  # Exits 1 when any chat failed, and names them in the job
                  # summary. It still finishes the sweep first: one bad group
                  # must not stall the rest, and a caught error that reads as
                  # "completed success" is how five chats sat migrated and
                  # unhanded-over for days.
                  python3 tools/telegram/grant_admin.py

            # always(), so a run that reported a failed chat still commits the
            # handovers that DID land. The exit code is the signal; the registry
            # writes are not hostage to it.
            - name: Commit registry updates
              if: always() && steps.check.outputs.run == 'yes'
              run: |
                  if git diff --quiet; then
                    echo "no handovers today"
                    exit 0
                  fi
                  git config user.name "github-actions[bot]"
                  git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                  git add data/telegram-groups.json
                  git commit -m "data: telegram handover sweep"
                  for i in 1 2 3; do
                    git push origin HEAD:main && exit 0
                    git pull --rebase origin main || exit 1
                    sleep 3
                  done
                  exit 1
