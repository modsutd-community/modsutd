name: scrape

on:
    schedule:
        # Fridays 16:00 UTC is Saturday 00:00 in Singapore; the job keeps only
        # the first Saturday of the month.
        - cron: "30 16 * * 5"
    workflow_dispatch:

permissions:
    contents: write
    pull-requests: write

jobs:
    scrape:
        runs-on: ubuntu-latest
        timeout-minutes: 15
        steps:
            # cron cannot say "first Saturday", so workaround:
            - name: First Saturday of the month
              id: when
              run: |
                  d=$(TZ=Asia/Singapore date +%d)
                  if [ "$((10#$d))" -le 7 ]; then
                    echo "go=true" >> "$GITHUB_OUTPUT"
                  else
                    echo "go=false" >> "$GITHUB_OUTPUT"
                    echo "Not the first Saturday in Singapore ($d) - nothing to do." >> "$GITHUB_STEP_SUMMARY"
                  fi

            # Checked BEFORE the refresh, not after. main's ruleset only lets
            # the admin role bypass, so create-pull-request cannot open this PR
            # without the bot token. Finding that out at the last step means
            # 389 pages were read and the result thrown away.
            - name: The bot token has to exist
              if: steps.when.outputs.go == 'true'
              env:
                  TOKEN: ${{ secrets.MODSUTD_BOT_TOKEN }}
              run: |
                  if [ -z "$TOKEN" ]; then
                    echo "MODSUTD_BOT_TOKEN is not set. .env.example says what it is and where it goes." >&2
                    exit 1
                  fi

            - uses: actions/checkout@v4
              if: steps.when.outputs.go == 'true'

            - uses: actions/setup-python@v5
              if: steps.when.outputs.go == 'true'
              with:
                  python-version: "3.12"
                  cache: "pip"
                  cache-dependency-path: tools/scraper/requirements.txt

            - name: install scraper deps
              if: steps.when.outputs.go == 'true'
              working-directory: tools/scraper
              run: pip install -r requirements.txt

            # One command for everything a mod record is made of: the course
            # listing, the pillar sites, specialisation tracks, term dates, and
            # a prerequisite reconciliation. It isolates its own steps - one
            # SUTD page being redesigned must not hold the other four hostage -
            # so it is not marked continue-on-error here; it already is
            # internally, and a non-zero exit means EVERY step failed, which is
            # the network rather than a page.
            - name: refresh the mods
              if: steps.when.outputs.go == 'true'
              # Named, not inherited. `shell: bash` is `bash -eo pipefail`, so
              # the pipe below reports the scraper's status and not tee's; a
              # refresh that failed every step would otherwise open a PR
              # looking healthy. Do not drop this to rely on the default.
              shell: bash
              run: |
                  python tools/scraper/mods_refresh.py | tee -a "$GITHUB_STEP_SUMMARY"

            - name: open PR with diff
              if: steps.when.outputs.go == 'true'
              uses: peter-evans/create-pull-request@v6
              with:
                  # No GITHUB_TOKEN fallback. main's ruleset only lets the
                  # admin role bypass, so the default token cannot open this PR
                  # and would fail after the refresh had already done its work.
                  # Absent secret, this step fails loudly instead.
                  token: ${{ secrets.MODSUTD_BOT_TOKEN }}
                  commit-message: "data: monthly mods refresh"
                  title: "data: monthly mods refresh"
                  body: |
                      `tools/scraper/mods_refresh.py`. The step summary on the run says which
                      of its six steps passed and what changed.

                      Skim the diff. SUTD's HTML changes silently and a parser can pull in junk;
                      if something looks wrong, kick this back and patch the source under
                      `tools/scraper/`.

                      Two things worth a closer look:

                      - **Term dates.** They decide where a weekly-view paste puts a term of classes.
                      - **Prerequisites.** The refresh REPORTS drift and never applies it - a page
                        can name a code and then disown it ("helpful but not required"). Read the
                        sentence before editing a record.
                  branch: chore/mods-refresh-${{ github.run_id }}
                  base: main
                  delete-branch: true
                  labels: data, automated
