name: scrape

on:
    schedule:
        # Fridays 16:00 UTC is Saturday 00:00 in Singapore; the job keeps only
        # the first Saturday of the month.
        - cron: "30 16 * * 5"
    workflow_dispatch:

permissions:
    contents: write
    pull-requests: write

jobs:
    scrape:
        runs-on: ubuntu-latest
        timeout-minutes: 15
        steps:
            # cron cannot say "first Saturday", so workaround:
            - name: First Saturday of the month
              id: when
              run: |
                  d=$(TZ=Asia/Singapore date +%d)
                  if [ "$((10#$d))" -le 7 ]; then
                    echo "go=true" >> "$GITHUB_OUTPUT"
                  else
                    echo "go=false" >> "$GITHUB_OUTPUT"
                    echo "Not the first Saturday in Singapore ($d) - nothing to do." >> "$GITHUB_STEP_SUMMARY"
                  fi

            - uses: actions/checkout@v4
              if: steps.when.outputs.go == 'true'

            - uses: actions/setup-python@v5
              if: steps.when.outputs.go == 'true'
              with:
                  python-version: "3.12"
                  cache: "pip"
                  cache-dependency-path: tools/scraper/requirements.txt

            - name: install scraper deps
              if: steps.when.outputs.go == 'true'
              working-directory: tools/scraper
              run: pip install -r requirements.txt

            - name: run scraper
              if: steps.when.outputs.go == 'true'
              working-directory: tools/scraper
              run: python scrape.py

            # Separate step, and allowed to fail on its own: the catalogue and
            # the calendar come from different SUTD pages, and one of them being
            # redesigned should not hold the other's data hostage. It refuses to
            # write a thin answer, so a failure here leaves the good file alone.
            - name: refresh the term calendar
              if: steps.when.outputs.go == 'true'
              continue-on-error: true
              working-directory: tools/scraper
              run: python term_calendar.py

            # Prerequisites drift and nothing here was watching. scrape.py
            # reads the HASS listing and the pillar stubs; gather_listing.py,
            # which reads the course pages, deliberately never touches a
            # record's prerequisites - so SUTD swapping 50.043's requirement
            # from 50.001 to (10.014 or 10.025) and 50.004 changed nothing in
            # /data and produced no diff to notice.
            #
            # This reports, and never edits. A prerequisite is a claim about
            # what a student is allowed to take, the page sometimes names a
            # code it then disowns ("helpful but not required"), and
            # /data/*.json changes through human-reviewed PRs. So the drift
            # lands in the step summary and the maintainer decides.
            - name: report prerequisite drift
              id: drift
              if: steps.when.outputs.go == 'true'
              continue-on-error: true
              run: |
                  python tools/scraper/audit_prereqs.py > drift.txt 2>/dev/null || true
                  {
                    echo '## prerequisite drift'
                    echo
                    echo 'Reported, not applied. Read the page sentence before editing a record;'
                    echo 'see `.claude/skills/course-data` for the standing exceptions.'
                    echo
                    echo '```'
                    sed -n '/^DIFFERS/,/^OR ON THE PAGE/p' drift.txt | head -60
                    echo '```'
                  } >> "$GITHUB_STEP_SUMMARY"

            - name: open PR with diff
              if: steps.when.outputs.go == 'true'
              uses: peter-evans/create-pull-request@v6
              with:
                  token: ${{ secrets.MODSUTD_BOT_TOKEN || secrets.GITHUB_TOKEN }}
                  commit-message: "data: monthly scrape"
                  title: "data: monthly scrape"
                  body: |
                      Auto-generated by `tools/scraper/scrape.py` and
                      `tools/scraper/term_calendar.py`.

                      Skim the diff before merging - SUTD's HTML changes silently and the parser
                      sometimes pulls in junk. Anything that looks wrong, kick the PR back and
                      patch the source under `tools/scraper/sources/`.

                      Term dates moving is normal and worth a closer look: they decide where a
                      weekly-view paste puts a term's worth of classes.
                  branch: chore/scrape-${{ github.run_id }}
                  base: main
                  delete-branch: true
                  labels: data, automated
