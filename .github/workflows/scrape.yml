name: scrape

on:
    schedule:
        # Fridays 16:00 UTC is Saturday 00:00 in Singapore; the job keeps only
        # the first Saturday of the month.
        - cron: "30 16 * * 5"
    workflow_dispatch:

permissions:
    contents: write
    pull-requests: write

jobs:
    scrape:
        runs-on: ubuntu-latest
        timeout-minutes: 15
        steps:
            # cron cannot say "first Saturday", so workaround:
            - name: First Saturday of the month
              id: when
              run: |
                  d=$(TZ=Asia/Singapore date +%d)
                  if [ "$((10#$d))" -le 7 ]; then
                    echo "go=true" >> "$GITHUB_OUTPUT"
                  else
                    echo "go=false" >> "$GITHUB_OUTPUT"
                    echo "Not the first Saturday in Singapore ($d) - nothing to do." >> "$GITHUB_STEP_SUMMARY"
                  fi

            # Checked BEFORE the refresh, not after. main's ruleset only lets
            # the admin role bypass, so create-pull-request cannot open this PR
            # without the bot token. Finding that out at the last step means
            # 389 pages were read and the result thrown away.
            - name: The bot token has to exist
              if: steps.when.outputs.go == 'true'
              env:
                  TOKEN: ${{ secrets.MODSUTD_BOT_TOKEN }}
              run: |
                  if [ -z "$TOKEN" ]; then
                    echo "MODSUTD_BOT_TOKEN is not set. .env.example says what it is and where it goes." >&2
                    exit 1
                  fi

            - uses: actions/checkout@v4
              if: steps.when.outputs.go == 'true'

            - uses: actions/setup-python@v5
              if: steps.when.outputs.go == 'true'
              with:
                  python-version: "3.12"
                  cache: "pip"
                  cache-dependency-path: tools/scraper/requirements.txt

            - name: install scraper deps
              if: steps.when.outputs.go == 'true'
              working-directory: tools/scraper
              run: pip install -r requirements.txt

            # One command for everything a mod record is made of: the
            # catalogue, hass.sutd.edu.sg, specialisation tracks, term dates,
            # a prerequisite reconciliation and a minor check, then a model
            # reading the last two into proposed edits. It isolates its own
            # steps, so it is not marked continue-on-error here: it already is
            # internally, and a non-zero exit means EVERY step failed, which
            # is the network rather than a page.
            #
            # The model tokens are optional. Without them the `propose` step
            # says so and the drift report is still committed, so the PR opens
            # either way.
            # The same proxy the reviewer uses, for the same reason: the free
            # Gemini API tier is 5 requests a minute and 20 a day, and a refresh
            # asks a model about every course whose prerequisites read as prose.
            # It needs no credential. When it fails to start, nothing here
            # changes: GEMINI_WEB2API_URL stays unset and agents/llm.py falls
            # through to the token providers exactly as before.
            - name: start gemini-web2api
              id: proxy
              if: steps.when.outputs.go == 'true'
              continue-on-error: true
              run: |
                  pip install httpx
                  python tools/ci/gemini_web2api.py > /tmp/web2api.log 2>&1 &
                  for i in $(seq 1 30); do
                      curl -sf http://127.0.0.1:8081/v1/models >/dev/null 2>&1 && break
                      sleep 1
                  done
                  curl -sf http://127.0.0.1:8081/v1/models >/dev/null
                  echo "url=http://127.0.0.1:8081/v1/chat/completions" >> "$GITHUB_OUTPUT"

            - name: refresh the mods
              id: refresh
              if: steps.when.outputs.go == 'true'
              # Redirected, not piped. `cmd | tee` reports tee's status, so a
              # refresh that failed every step used to open a PR looking
              # healthy. With a plain redirect the step's exit code is the
              # scraper's, and there is no shell setting to get wrong.
              env:
                  # Empty when the proxy did not start, which is what turns the
                  # web route off in agents/llm.py.
                  GEMINI_WEB2API_URL: ${{ steps.proxy.outputs.url }}
                  # Optional. `propose` says so in its own report when none
                  # is set, and the rest of the refresh is unaffected.
                  GEMINI_TOKEN: ${{ secrets.GEMINI_TOKEN }}
                  GROQ_TOKEN: ${{ secrets.GROQ_TOKEN }}
                  OPENAI_TOKEN: ${{ secrets.OPENAI_TOKEN }}
              run: |
                  python tools/scraper/mods_refresh.py --status-out "$GITHUB_OUTPUT" > /tmp/refresh.md
                  cat /tmp/refresh.md >> "$GITHUB_STEP_SUMMARY"

            # The PR body IS the report. Pointing a reviewer at a run summary
            # they have to go and open is how the prereq and minor findings came
            # to sit unread: the diff is in front of them and the reasoning was
            # somewhere else.
            - name: assemble the PR body
              if: steps.when.outputs.go == 'true'
              run: |
                  {
                    if [ -n "${{ steps.refresh.outputs.failed }}" ]; then
                      echo "> PARTIAL REFRESH. These steps failed and their part of the data is unchanged: ${{ steps.refresh.outputs.failed }}."
                      echo
                    fi
                    echo 'Opened by `tools/scraper/mods_refresh.py`.'
                    echo
                    echo 'Skim the diff. SUTD HTML changes silently and a parser can pull in junk;'
                    echo 'if something looks wrong, kick this back and patch the source under'
                    echo '`tools/scraper/`. Two things are worth a closer look every time:'
                    echo
                    echo '- **Term dates.** They decide where a weekly-view paste puts a term of classes.'
                    echo '- **Data changes.** The run output names the RECORD each change landed in'
                    echo '  and the source URL that record carries. Open that URL, not the diff hunk:'
                    echo '  a hunk in a 21-track JSON file does not say which track it belongs to.'
                    echo '- **Prerequisites.** Every proposed edit below quotes the page it came from.'
                    echo '  Read the quote. A page can name a code and then disown it.'
                    echo
                    cat tools/scraper/.reports/proposed.md 2>/dev/null || true
                    echo
                    echo '<details><summary>full run output</summary>'
                    echo
                    cat /tmp/refresh.md
                    echo
                    echo '</details>'
                  } > /tmp/pr-body.md

            - name: open PR with diff
              if: steps.when.outputs.go == 'true'
              uses: peter-evans/create-pull-request@v6
              with:
                  # No GITHUB_TOKEN fallback. main's ruleset only lets the
                  # admin role bypass, so the default token cannot open this PR
                  # and would fail after the refresh had already done its work.
                  # Absent secret, this step fails loudly instead.
                  token: ${{ secrets.MODSUTD_BOT_TOKEN }}
                  commit-message: "data: monthly mods refresh"
                  title: "data: monthly mods refresh"
                  body-path: /tmp/pr-body.md
                  branch: chore/mods-refresh-${{ github.run_id }}
                  base: main
                  delete-branch: true
                  labels: data, automated
