# Creates a mod's batch chat on first click, relayed by /api/telegram-group
# as a repository_dispatch. The registry (data/telegram-groups.json) is the
# idempotency gate; the payload is attacker-reachable so it stays in env
# vars and is validated from scratch (code format, mod exists, term >= 3 or
# HASS).Relies on TG_* secrets.
name: Create telegram group

on:
    repository_dispatch:
        types: [telegram-group]

permissions:
    contents: write

# Per MOD, not one queue for the whole workflow. GitHub holds exactly one
# pending run per group, so a third request while a first is running cancels
# the second: with a single group, a student whose pasted timetable has three
# eligible mods and who clicks all three loses the middle one, silently, and a
# term's worth asked for at once loses almost all of them.
#
# Keyed on the mod, duplicate clicks for the SAME mod still queue and the
# second one skips on the registry, which is what should happen. Different mods
# no longer see each other. The commit step is what makes that safe.
concurrency:
    group: telegram-group-${{ github.event.client_payload.mod }}
    cancel-in-progress: false

jobs:
    create:
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - uses: actions/checkout@v4
              with:
                  ref: main
                  # Pushes to main, so it must authenticate as the token's owner.
                  # main's ruleset requires a reviewed pull request and its only
                  # bypass actor is the admin repository role, which
                  # github-actions[bot] does not hold and cannot be granted.
                  # Without this the push is rejected GH013 after the work is done.
                  token: ${{ secrets.MODSUTD_BOT_TOKEN || secrets.GITHUB_TOKEN }}

            - name: Validate and gate on the registry
              id: gate
              env:
                  PAYLOAD: ${{ toJSON(github.event.client_payload) }}
              run: |
                  python3 - <<'PY' >> "$GITHUB_OUTPUT"
                  import datetime, json, os, pathlib, re, sys
                  payload = json.loads(os.environ["PAYLOAD"])
                  code = str(payload.get("mod", ""))
                  if not re.fullmatch(r"\d{2}\.\d{3}", code):
                      print("skip=bad-code"); sys.exit(0)
                  f = pathlib.Path(f"data/courses/{code.replace('.', '_')}.json")
                  if not f.exists():
                      print("skip=unknown-mod"); sys.exit(0)
                  mod = json.loads(f.read_text())
                  hass = mod.get("pillar") == "HASS" or "HASS" in (mod.get("tags") or [])
                  if not hass and int(mod.get("term", "1")) < 3:
                      print("skip=ineligible"); sys.exit(0)
                  # Capstone / thesis: own project teams, no cohort to chat with.
                  # The data says which mods get no chat; the name regex
                  # stays as a fallback for records that predate the flag.
                  if mod.get("noBatchChat") or re.search(r"(?i)capstone|thesis", mod["name"]):
                      print("skip=solo-project"); sys.exit(0)
                  # Offered this term = has crowdsourced schedules. No group for a
                  # mod nobody is taking.
                  if not mod.get("schedules"):
                      print("skip=not-offered"); sys.exit(0)
                  # The batch window comes from the term dates carried by the
                  # crowdsourced timetables themselves.
                  win = json.loads(pathlib.Path("data/term-window.json").read_text() or "{}")
                  t = datetime.date.today()
                  if not win.get("end") or win["end"] < t.isoformat():
                      print("skip=no-live-term"); sys.exit(0)
                  reg = json.loads(pathlib.Path("data/telegram-groups.json").read_text() or "{}")
                  cur = reg.get(code)
                  if cur and t.isoformat() <= str(cur.get("expires") or ""):
                      print("skip=exists"); sys.exit(0)
                  print(f"expires={win['end']}")
                  # Telegram allows 50 groups or channels a day per account and
                  # answers a 51st with a flood error, so the cap is a real
                  # limit rather than a preference. 40 leaves room for the
                  # handover sweep and a retry without going near it. It used
                  # to be 6, which was fine while chats arrived one paste at a
                  # time and is six days of waiting once a term's timetable is
                  # imported in one go.
                  if sum(1 for v in reg.values() if v.get("createdDay") == t.isoformat()) >= 40:
                      print("skip=daily-cap"); sys.exit(0)
                  print("skip=")
                  print(f"code={code}")
                  print(f"name={mod['name']}")
                  PY

            - name: Create the group
              if: steps.gate.outputs.skip == ''
              env:
                  TG_API_ID: ${{ secrets.TG_API_ID }}
                  TG_API_HASH: ${{ secrets.TG_API_HASH }}
                  TG_SESSION: ${{ secrets.TG_SESSION }}
                  TG_LINK_KEY: ${{ secrets.TG_LINK_KEY }}
                  TG_BOT_USERNAME: ${{ vars.TG_BOT_USERNAME }}
                  MOD_CODE: ${{ steps.gate.outputs.code }}
                  MOD_NAME: ${{ steps.gate.outputs.name }}
              run: |
                  pip install --quiet telethon cryptography
                  python3 tools/telegram/create_group.py | tee /tmp/created.json

            # Optimistic concurrency: every attempt starts from the CURRENT
            # main, re-reads the registry and writes its one entry, so two runs
            # landing together merge instead of one clobbering the other.
            #
            # The previous loop pushed first and only then pulled --rebase,
            # which cannot work here: both sides rewrite the whole file, so the
            # rebase conflicts and the second run fails after its group already
            # exists on Telegram. That failure is why this workflow could only
            # ever run one at a time.
            # The group is real and unregistered. Reading a failed job's log
            # for a chat id is not a recovery path anybody follows, so it goes
            # in the summary with what to do about it.
            - name: Say where an orphaned group is
              if: failure()
              run: |
                  [ -f /tmp/orphan.json ] || exit 0
                  {
                    echo "### Telegram group created but has no link"
                    echo
                    echo "The group exists and the throwaway is in it. Export a"
                    echo "fresh invite for this chat and add the entry to"
                    echo '`data/telegram-groups.json` by hand:'
                    echo
                    echo '```json'
                    cat /tmp/orphan.json
                    echo
                    echo '```'
                  } >> "$GITHUB_STEP_SUMMARY"

            - name: Commit the registry entry
              if: steps.gate.outputs.skip == ''
              env:
                  EXPIRES: ${{ steps.gate.outputs.expires }}
              run: |
                  git config user.name "github-actions[bot]"
                  git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                  # `if` rather than capturing $?: the step runs under bash -e,
                  # where a failing standalone command exits before the next
                  # line, so a `wrote=$?` after the heredoc would never run. A
                  # command used as an `if` condition is exempt.
                  for attempt in 1 2 3 4 5; do
                    git fetch --quiet origin main
                    git reset --quiet --hard origin/main
                    if ! python3 - <<'PY'
                  import datetime, json, os, pathlib, sys
                  created = json.load(open('/tmp/created.json'))
                  p = pathlib.Path('data/telegram-groups.json')
                  reg = json.loads(p.read_text() or '{}')
                  today = datetime.date.today().isoformat()
                  # Re-checked here as well as in the gate. Runs for different
                  # mods now overlap, so several can pass a gate that read the
                  # same count and then all write. Telegram's own ceiling is 50
                  # a day and it answers a 51st with a flood error, so the last
                  # word on the cap belongs where the entry is actually added.
                  if sum(1 for v in reg.values() if v.get('createdDay') == today) >= 40:
                      print('daily cap reached between the gate and the commit; '
                            'the group exists on Telegram but is not registered. '
                            'Re-run this mod tomorrow.', file=sys.stderr)
                      sys.exit(3)
                  reg[created['code']] = {
                      'linkEnc': created['linkEnc'],
                      'title': created['title'],
                      'created': created['created'],
                      'createdDay': today,
                      'expires': os.environ.get('EXPIRES', ''),
                      'chatId': created['chatId'],
                  }
                  p.write_text(json.dumps(reg, indent=2, sort_keys=True) + '\n')
                  PY
                    then
                      exit 1   # the reason is already on stderr
                    fi
                    git add data/telegram-groups.json
                    git diff --cached --quiet && exit 0   # already registered
                    git commit --quiet -m "data: telegram group registry entry"
                    git push --quiet origin HEAD:main && exit 0
                    # Someone else pushed between the fetch and the push. Back
                    # off by a different amount per run so two do not keep
                    # colliding on the same beat.
                    sleep $(( (RANDOM % 5) + attempt * 2 ))
                  done
                  # Every attempt lost the race. The group EXISTS on Telegram
                  # at this point, and an entry that never lands is a group
                  # nothing can find: no student gets the link, the daily cap
                  # does not count it, and the end-of-term sweep never leaves
                  # it, because all three read the registry. So the entry goes
                  # where a person will find it. Nothing here is a secret the
                  # registry does not already hold in the clear on main.
                  {
                    echo "### Telegram group created but NOT registered"
                    echo
                    echo "Five pushes to main all lost the race. The group is live."
                    echo "Add this to \`data/telegram-groups.json\` by hand:"
                    echo
                    echo '```json'
                    cat /tmp/created.json
                    echo '```'
                  } >> "$GITHUB_STEP_SUMMARY"
                  echo "could not register the group after 5 attempts; the entry is in the job summary" >&2
                  exit 1
