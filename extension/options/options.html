<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>modSUTD - settings</title>
<style>
  body {
    background: #02010a;
    color: #e8f0f5;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    padding: 40px;
    max-width: 480px;
    margin: 0 auto;
  }
  h1 { color: #00f5d4; margin-bottom: 6px; }
  p  { color: rgba(232, 240, 245, 0.65); margin-bottom: 24px; line-height: 1.55; }
  label { font-size: 12px; letter-spacing: 0.15em; text-transform: uppercase; color: rgba(232,240,245,0.55); }
  input {
    display: block;
    width: 100%;
    margin-top: 8px;
    padding: 10px 14px;
    background: rgba(0,0,0,0.4);
    color: #e8f0f5;
    border: 1px solid rgba(232,240,245,0.18);
    border-radius: 6px;
    font-family: ui-monospace, monospace;
  }
  button {
    margin-top: 20px;
    padding: 10px 20px;
    background: #00f5d4;
    color: #02010a;
    border: none;
    border-radius: 999px;
    font-weight: 700;
    cursor: pointer;
  }
  .saved { color: #00f5d4; margin-top: 12px; opacity: 0; transition: opacity 0.3s; }
  .saved.show { opacity: 1; }
</style>
</head>
<body>
<h1>modSUTD settings</h1>
<p>Override the site origin if you're running modSUTD on localhost or your own domain.</p>
<label>site origin</label>
<input id="origin" type="url" placeholder="https://modsutd.tech">
<button id="save">save</button>
<div class="saved" id="saved">saved</div>

<script>
  const input = document.getElementById('origin');
  (async () => {
    const stored = await chrome.storage.sync.get('origin');
    input.value = stored.origin || 'https://modsutd.tech';
  })();

  document.getElementById('save').addEventListener('click', async () => {
    await chrome.storage.sync.set({ origin: input.value.replace(/\/$/, '') });
    const s = document.getElementById('saved');
    s.classList.add('show');
    setTimeout(() => s.classList.remove('show'), 1200);
  });
</script>
</body>
</html>
